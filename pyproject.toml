[project]
name = "tfm-master"
version = "0.1.0"
description = "Motor predictivo híbrido de mercados financieros (Series temporales + NLP FinBERT sobre US Big 6 Banks)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aioboto3>=15.5.0",
    "boto3>=1.40.61",
    "duckdb>=2.0.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "seaborn>=0.13.2",
    "yfinance>=1.7.0",
    "sentence-transformers>=6.2.0",
    "transformers>=5.22.1",
    "torch>=2.15.0",
]


[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "moto[server]>=5.0.0",
    "ipykernel>=7.4.0",
    "ruff>=0.8.0",
    "huggingface-hub[cli]>=2.3.0",
    "spacy>=3.8.18",
    "sentencepiece>=0.2.3",
    "en-core-web-sm",
    "google-genai>=3.6.1",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/articulos",
    "src/config",
    "src/dependencies",
    "src/infrastructure",
    "src/mercado",
    "src/sec",
    "src/shared",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
