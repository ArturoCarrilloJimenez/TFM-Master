[project]
name = "tfm-master"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aioboto3>=15.5.0",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "yfinance>=1.7.0",
]


[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "moto[server]>=5.0.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]


[tool.pytest.ini_options]
pythonpath = ["src"]
