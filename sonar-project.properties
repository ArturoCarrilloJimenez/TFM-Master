sonar.projectKey=ArturoCarrilloJimenez_TFM-Master
sonar.organization=arturocarrillojimenez
sonar.projectName=TFM-Master
sonar.projectVersion=1.0

sonar.sources=src,
sonar.tests=src/test,

# Analizamos todo el repositorio
sonar.language=py
sonar.sources=.
sonar.python.version=3.13

# Excluir de análisis estático
sonar.exclusions=**/test/**,**/.venv/**,**/__pycache__/**,**/*.md,**/.github/**,**/uv.lock

# Configuración de cobertura y pruebas
sonar.python.coverage.reportPaths=src/coverage.xml
sonar.python.xunit.reportPath=src/test-results.xml

# Encoding
sonar.sourceEncoding=UTF-8

sonar.qualitygate.wait=true
